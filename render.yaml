services:
  - type: web
    name: tsa-moderasyon-botu
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOKEN
        sync: false
      - key: ROBLOX_API_KEY
        sync: false
      - key: ROWIFI_API_KEY
        sync: false
      - key: ROBLOX_GRUP_ID
        sync: false
