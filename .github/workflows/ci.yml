name: Node.js checks

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible npm security fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Reinstall patched dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Report production dependency vulnerabilities
        continue-on-error: true
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const vulns=a.vulnerabilities||{}; const entries=Object.entries(vulns); console.log('Production dependency vulnerabilities:', a.metadata?.vulnerabilities||{}); for (const [name,v] of entries) console.log(name+': '+v.severity+'; direct='+v.isDirect+'; fix='+JSON.stringify(v.fixAvailable));"

      - name: Commit patched dependency lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): patch vulnerable npm dependencies"
          git push origin HEAD:main
